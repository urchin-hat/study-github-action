name: "CI"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  lint:
    name: "Lint & Format"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Go"
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: "Check format with gofmt"
        run: |
          diff_files=$(gofmt -s -l .)
          if [ -n "$diff_files" ]; then
            echo "The following files are not formatted properly:"
            echo "$diff_files"
            exit 1
          fi
          echo "gofmt check passed!"

      - name: "Run static analysis with go vet"
        run: go vet ./...

  test:
    name: "Unit Test"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Go"
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: "Run unit tests"
        run: go test -v ./...

  build:
    name: "Build Binary"
    runs-on: "ubuntu-latest"
    needs: [lint, test]
    timeout-minutes: 5
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Go"
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: "Build application binary"
        run: |
          go build -v -o bin/study-server .
          ls -lh bin/study-server
