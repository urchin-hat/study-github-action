name: "CI"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  lint:
    name: "Lint & Format"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Go"
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: "Check format with gofmt"
        run: |
          diff_files=$(gofmt -s -l .)
          if [ -n "$diff_files" ]; then
            echo "The following files are not formatted properly:"
            echo "$diff_files"
            exit 1
          fi
          echo "gofmt check passed!"

      - name: "Run static analysis with go vet"
        run: go vet ./...

  test:
    name: "Unit Test (Go ${{ matrix.go-version }})"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    strategy:
      matrix:
        go-version: ["1.21", "1.22", "1.23"]
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Go"
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: "Check Go version"
        run: go version

      - name: "Run unit tests"
        run: go test -v ./...

  build:
    name: "Build Binary"
    runs-on: "ubuntu-latest"
    needs: [lint, test]
    timeout-minutes: 5
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Go"
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: "Cache Go build cache"
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: "Build application binary"
        run: |
          go build -v -o bin/study-server .
          ls -lh bin/study-server

      - name: "Upload build binary as artifact"
        uses: actions/upload-artifact@v4
        with:
          name: study-server-binary
          path: bin/study-server
          retention-days: 1

  verify:
    name: "Verify Artifact"
    runs-on: "ubuntu-latest"
    needs: [build]
    timeout-minutes: 5
    steps:
      - name: "Download build binary from artifact"
        uses: actions/download-artifact@v4
        with:
          name: study-server-binary
          path: bin/

      - name: "Verify downloaded binary and run health check"
        run: |
          echo "=== Check downloaded files ==="
          ls -la bin/

          echo "=== Add execute permission and run binary ==="
          chmod +x bin/study-server
          bin/study-server &
          SERVER_PID=$!

          # Wait for server to start
          sleep 2

          echo "=== Test /health endpoint ==="
          curl -s -i http://localhost:8080/health
          echo ""

          echo "=== Test /hello endpoint ==="
          curl -s -i "http://localhost:8080/hello?name=GitHubActions"
          echo ""

          # Terminate server
          kill $SERVER_PID
          echo "Verification passed successfully!"
