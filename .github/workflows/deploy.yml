name: "Deploy"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Environment"
        required: true
        type: choice
        options:
          - "staging"
          - "production"
        default: "staging"

permissions:
  contents: read

jobs:
  build:
    name: "Build Binary"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Go"
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: "Build application binary"
        run: |
          mkdir -p bin
          go build -v -o bin/study-server .

      - name: "Upload build binary as artifact"
        uses: actions/upload-artifact@v4
        with:
          name: deploy-server-binary
          path: bin/study-server
          retention-days: 1

  deploy:
    name: "Deploy to ${{ inputs.environment }}"
    needs: [build]
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    environment:
      name: ${{ inputs.environment }}
      url: "https://${{ inputs.environment }}.example.com"
    concurrency:
      group: "deploy-${{ inputs.environment }}"
      cancel-in-progress: false
    steps:
      - name: "Download binary artifact"
        uses: actions/download-artifact@v4
        with:
          name: deploy-server-binary
          path: bin/

      - name: "Execute Deployment"
        env:
          TARGET_ENV: ${{ inputs.environment }}
          DEPLOY_ACTOR: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "=========================================="
          echo "🚀 Deploying to Environment: $TARGET_ENV"
          echo "👤 Deployed by: $DEPLOY_ACTOR"
          echo "🔖 Commit SHA: $COMMIT_SHA"
          echo "=========================================="

          chmod +x bin/study-server
          ls -la bin/study-server

          echo "Simulating service deployment..."
          sleep 3
          echo "✅ Deployment to $TARGET_ENV completed successfully!"
