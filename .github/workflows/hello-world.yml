name: "chap3"

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  job-a:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Run Job A"
        run: |
          echo "Job A started at: $(date +'%H:%M:%S')"
          sleep 3
          echo "Job A finished at: $(date +'%H:%M:%S')"

  job-b:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Run Job B"
        run: |
          echo "Job B started at: $(date +'%H:%M:%S')"
          sleep 3
          echo "Job B finished at: $(date +'%H:%M:%S')"
