name: "chap3"

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    outputs:
      build_version: ${{ steps.set_version.outputs.version }}
    steps:
      - name: "Build application"
        id: set_version
        run: |
          echo "Building application artifacts..."
          echo "version=v1.0.0-chap3" >> "$GITHUB_OUTPUT"

  test:
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Run test suite (runs in parallel with build)"
        run: echo "All test suites passed successfully."

  deploy:
    runs-on: "ubuntu-latest"
    needs: [build, test]
    timeout-minutes: 5
    steps:
      - name: "Deploy to production"
        run: |
          echo "Deploying version: ${{ needs.build.outputs.build_version }}"
          echo "Deployment completed successfully."
