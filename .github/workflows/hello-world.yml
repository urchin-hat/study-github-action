name: "chap3"

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  # エラーを許容するJob
  flaky-job:
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: "Simulate failure with continue-on-error"
        run: |
          echo "This job has continue-on-error: true and timeout-minutes: 5"
          echo "Simulating failure..."
          exit 1

  # flaky-jobに依存する通常の後続Job（スキップされずに動くはず！）
  downstream-job:
    runs-on: "ubuntu-latest"
    needs: [flaky-job]
    steps:
      - name: "Run downstream job"
        run: |
          echo "Downstream job executed successfully because flaky-job was allowed to fail!"
