name: "chap3"

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  test-job:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Simulate test failure"
        run: |
          echo "Running test suite..."
          echo "Error: 1 test failed!"
          exit 1

  # 1. 通常の後続Job（暗黙の if: success() なので、test-job失敗によりスキップされる）
  deploy-job:
    runs-on: "ubuntu-latest"
    needs: [test-job]
    steps:
      - name: "Deploy application"
        run: echo "Deploying to production..."

  # 2. 常時実行の後続Job（if: always() なので、test-job失敗でも動く）
  notify-job:
    runs-on: "ubuntu-latest"
    needs: [test-job]
    if: always()
    steps:
      - name: "Send notification"
        run: |
          echo "=== Notification Service ==="
          echo "test-job result was: ${{ needs.test-job.result }}"
          echo "Alert: Deployment was prevented because test-job failed."
