name: "chap2"

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
  workflow_dispatch:
jobs:
  compare-vars:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Compare Expression vs Shell Variable"
        env:
          MESSAGE: "Hello from env"
        run: |
          echo "=== 1. Expression展開 ==="
          echo "Value: ${{ env.MESSAGE }}"
          echo "Event: ${{ github.event_name }}"
          echo "=== 2. シェル環境変数 ==="
          echo "Value: $MESSAGE"
          echo "Event: $GITHUB_EVENT_NAME"

