name: "chap3"

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  job-a:
    runs-on: "ubuntu-latest"
    # Job Outputsを定義して後続へ公開
    outputs:
      my_token: ${{ steps.step1.outputs.token }}
    steps:
      - name: "Generate data and outputs"
        id: step1
        run: |
          echo "Job A started at: $(date +'%H:%M:%S')"
          # 1. ファイルを作ってみる
          echo "Created in job-a" > job_a_file.txt
          # 2. 環境変数をセットしてみる
          echo "MY_VAR=from-job-a" >> "$GITHUB_ENV"
          # 3. Step Output をセットする
          echo "token=secret-token-xyz" >> "$GITHUB_OUTPUT"
          sleep 2
          echo "Job A finished at: $(date +'%H:%M:%S')"

  job-b:
    runs-on: "ubuntu-latest"
    needs: [job-a]
    steps:
      - name: "Verify isolation and receive output"
        run: |
          echo "Job B started at: $(date +'%H:%M:%S')"
          echo "=== 1. ファイルの確認 ==="
          ls job_a_file.txt || echo "File not found! (別マシンなので存在しない)"
          echo "=== 2. 環境変数の確認 ==="
          echo "MY_VAR: '$MY_VAR' (別マシンなので空)"
          echo "=== 3. Job Outputsの確認 ==="
          echo "Token from job-a: ${{ needs.job-a.outputs.my_token }}"
